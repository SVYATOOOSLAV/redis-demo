spring:
  application:
    name: redis-demo
  main:
    banner-mode: off
  datasource:
    url: ${DATABASE_JDBC_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 3
      pool-name: "HikariPoolPostgres"
      driver-class-name: org.postgresql.Driver
    driver-class-name: org.postgresql.Driver
  liquibase:
    change-log: ./db/changelog/master-changelog.xml
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  caches:
    - cache-name: users
      ttl: 60s

app:
  security:
    users:
      - username: user1
        password: ${FIRST_USER_PASSWORD}
        roles: USER
      - username: admin
        password: ${SECOND_USER_PASSWORD}
        roles: ADMIN,USER